[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tenqsp-fit"
dynamic = ["version"]
description = "Fitting TenQSP models to data, with diagnosis of what the data determine"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Dongwoo Chae" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "tenqsp>=0.6.1",
    "jax>=0.4.30",
    "numpy>=1.26",
    "numpyro>=0.15",
    "optimistix>=0.0.9",
    "blackjax>=1.2",
    "arviz>=1.0",
    "pandas>=2.0",
    "scipy>=1.11",
]

[project.urls]
Repository = "https://github.com/tenqsp/tenqsp-fit"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
docs = ["matplotlib>=3.8", "mkdocs>=1.6", "mkdocs-material>=9.5"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6"]

[tool.hatch.version]
path = "src/tenqsp_fit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tenqsp_fit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "slow: minutes each (NUTS runs, validation against references); CI runs them after the others",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
