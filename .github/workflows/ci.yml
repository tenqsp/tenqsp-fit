name: CI

# - each push to main and each pull request: lint and the tests not marked slow, Linux,
#   Python 3.12 (not for documentation-only changes); an older run is cancelled when a newer
#   push arrives;
# - Mondays, release tags and on demand: Python 3.12 and 3.13, plus the slow tests (NUTS runs,
#   validation against the stored reference fits) on 3.12.
# TenQSP (0.8.0 or later) comes from PyPI. The documentation is built and published by
# docs.yml.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  test:
    if: ${{ github.repository == 'tenqsp/tenqsp-fit' && !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON((github.ref_type == 'tag' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.12", "3.13"]' || '["3.12"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      JAX_PLATFORMS: cpu
      FULL: ${{ github.ref_type == 'tag' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests validation
          ruff format --check src tests validation
      # GitHub's runners are 2-4x slower than the development machine: the per-test limit
      # (120 s, there to catch a hang) is raised
      - name: Tests (not slow)
        run: pytest -q -p no:cacheprovider -m "not slow" -o timeout=600
      - name: Slow tests (Mondays, tags, on demand)
        if: matrix.python-version == '3.12' && env.FULL == 'true'
        run: pytest -q -p no:cacheprovider -m slow -o timeout=3600
