name: CI

# The repository is private until its first release, so every run spends the account's
# Actions minutes: CI runs on demand (Actions tab, or gh workflow run ci.yml) and on Mondays,
# not on each push (owner, 2026-11-03). Each run: lint, the tests not marked slow, then the
# slow ones (NUTS runs, validation against the stored reference fits); Linux, Python 3.12.
# TenQSP is installed from its main branch: tenqsp-fit 0.1 needs TenQSP 0.7.0, not
# yet released.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]  # 3.13 at the release check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests validation
          ruff format --check src tests validation
      # GitHub's runners are 2-4x slower than the development machine: the per-test limit
      # (120 s, there to catch a hang) is raised
      - name: Tests (not slow)
        run: pytest -q -p no:cacheprovider -m "not slow" -o timeout=600
      - name: Slow tests
        run: pytest -q -p no:cacheprovider -m slow -o timeout=3600
